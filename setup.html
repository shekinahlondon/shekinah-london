<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Account Setup · Shekinah Nation London</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF9F6">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <div class="brand-hero"><img class="logo" src="logo.png" alt="Shekinah Nation" width="360" height="360"></div>
  <div class="page-head">
    <p class="eyebrow">Team access</p>
    <h1>Set your password</h1>
    <p id="info" class="lead">Checking your link…</p>
  </div>
  <form id="sf" class="card hidden" novalidate>
    <label>Email</label><input id="em" disabled>
    <label for="pw">New password <span class="opt">(at least 10 characters)</span></label>
    <input id="pw" type="password" autocomplete="new-password" minlength="10">
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password">
    <div id="m" class="msg hidden"></div>
    <button class="btn block" id="b" style="margin-top:16px">Create my account</button>
  </form>
</main>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const token = new URLSearchParams(location.search).get("t") || "";
const call = (body) => fetch(`${SNL.SUPABASE_URL}/functions/v1/staff-setup`, {
  method: "POST", headers: { apikey: SNL.SUPABASE_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ token, ...body }),
}).then((r) => r.json());
const m = $("#m");
const say = (t, ok) => { m.textContent = t; m.className = "msg " + (ok ? "ok" : "err"); };
call({ action: "check" }).then((out) => {
  if (!out.ok) { $("#info").textContent = out.error; return; }
  $("#info").textContent = `Welcome${out.full_name ? ", " + out.full_name : ""}. You're being set up as ${out.role === "admin" ? "an admin" : "an usher"}.`;
  $("#em").value = out.email; $("#sf").classList.remove("hidden");
}).catch(() => { $("#info").textContent = "Couldn't check this link. Please try again."; });

$("#sf").addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("#pw").value;
  if (pw.length < 10) return say("Please use at least 10 characters.");
  if (pw !== $("#pw2").value) return say("The passwords don't match.");
  $("#b").disabled = true;
  const out = await call({ action: "set", password: pw }).catch(() => ({ ok: false, error: "Connection problem." }));
  if (!out.ok) { say(out.error); $("#b").disabled = false; return; }
  say("All set! Taking you to the dashboard…", true);
  setTimeout(() => (location.href = "admin.html"), 1200);
});
</script>
</body>
</html>
